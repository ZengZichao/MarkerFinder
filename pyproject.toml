[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markerfinder"
# Single source of truth for the version is markerfinder/_version.py — see
# [tool.setuptools.dynamic] below. It used to be restated here as a literal, so
# a release could bump one copy and ship the other.
dynamic = ["version"]
description = "Adaptive HGT-Aware Phylogenomic Pipeline for Prokaryotic Marker Gene Selection"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Zengzichao", email = "zengzichao@sjtu.edu.cn"},
]
keywords = ["phylogenomics", "marker-genes", "HGT", "MAG", "prokaryote"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "biopython>=1.81",
    "pyyaml>=6.0",
    "ete3>=3.1",
    "tomli>=2.0;python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # The acceptance layer documents `run_validation.py -n 8`, but -n is
    # pytest-xdist's flag and neither environment.yml nor this list installed
    # it — the documented command failed on a fresh dev install.
    "pytest-xdist>=3.0",
    # Static checking of the type-annotated modules. Dev-only — the runtime
    # dependency set stays at biopython/pyyaml/ete3/tomli.
    #
    # Deliberately NOT a CI gate yet. `mypy markerfinder --ignore-missing-imports`
    # reports 89 errors across 16 of 62 modules (the bulk in pipeline.py,
    # gtdb_tk_markers.py, modules/phylogenetic_inference.py), and the pinned
    # mypy has no --baseline-file, so a ratchet on the error count is not
    # available. Turning it on today would mean a permanently red first run,
    # which is worse than an honest absence. Fix the errors, then gate it.
    "mypy>=1.8",
    "types-PyYAML>=6.0",
]

[project.scripts]
markerfinder = "markerfinder.__main__:main"

[project.urls]
Homepage = "https://github.com/ZengZichao/MarkerFinder"
Issues = "https://github.com/ZengZichao/MarkerFinder/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["markerfinder*"]

[tool.setuptools.dynamic]
# Read statically from markerfinder/_version.py, which imports nothing, so the
# build never has to import the package (and never has to install ete3) to learn
# the version. __init__.py re-exports the same constant, so `markerfinder
# --version`, the banner and the installed metadata cannot disagree.
version = {attr = "markerfinder._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
# The test suites import the package from the repository, so an editable install
# is not a precondition for running them (and a plain "pytest" from the repo root
# works even where the interpreter does not default to adding the CWD).
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["markerfinder"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 65
show_missing = true
