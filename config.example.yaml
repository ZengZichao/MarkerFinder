# MarkerFinder Example Configuration
# Copy this file and modify as needed.
# Usage: markerfinder --config config.yaml -i genomes/ -o output/
#
# Priority: CLI arguments > Config file > Defaults

# Input/Output
input: genomes/ # Input genome directory (.faa files)
output: output/ # Output directory
threads: 4 # Number of CPU threads

# Analysis mode
# Options: conservative, standard, expanded, mag_adaptive
mode: standard

# HGT Filtering
# Which HGT screening steps to run. phylogenetic = the topological-incongruence
# criterion (it drives the risk grading); composition = the compositional / GC-bias
# diagnostic, emitted only as a parallel evidence column and never folded into
# overall_risk / overall_score.
hgt_steps: "phylogenetic" # may be "phylogenetic,composition"; phylogenetic step only by default
hgt_threshold: 0.25 # HGT risk threshold
# Distant-lineage adaptive relaxation (off by default): on distant datasets
# (>= 2 orders, or genus ratio >= 0.70) it keeps markers from all being discarded
# as Level 3. Equivalent CLI flag: --hgt-adaptive-thresholds.
# hgt_adaptive_thresholds: false

# ---- switches added by the self-review round ----
# All of them have a default, and the default behaviour equals the pre-refactor baseline.
# The key name is the CLI dest, so the same-named flag overrides it (CLI > config file > defaults).

# Two threshold keys: the two edges of HGTConfig.level_thresholds can now be set separately
# hgt_threshold_l1l2: 0.25 # Level1/Level2 edge (--hgt-threshold-l1l2)
# hgt_threshold_l2l3: 0.60 # Level2/Level3 edge (--hgt-threshold-l2l3)
# Note: hgt_threshold is kept as a backward-compatible alias for l1l2 and prints a deprecation notice once.

# When the distant-lineage relaxation takes effect it leaves a trace in two places - the report
# header and the per-marker decision card - and level2_max is overridden by level2_max_far;
# it is no longer just one INFO log line.

# max_markers: 60 # marker budget, previously hardcoded inside the code
# marker_preset: "none" # none|conservative|standard|expanded|mag_adaptive
# # "none" keeps the current occupancy top-K behaviour;
# # picking a preset explicitly overrides with its min_occupancy/max_markers/strategy triple
# require_evidence_coverage: 0.5 # prominent report-header warning when HGT evidence coverage falls below this (warning only)
# hgt_scan: false # threshold scan (--hgt-scan): only re-evaluates the risk values already computed,
# # never re-runs any external tool; writes {prefix}.threshold_scan.tsv
# scan_stability_min: 0.6 # Jaccard floor for the selected marker set across bins; below it the verdict is recorded as inconclusive
# hgt_mode: "risk" # risk|consistency|hybrid; the default risk never switches automatically;
# # consistency/hybrid must pass a structured gate (it validates observable artifacts,
# # so a flag alone cannot fake it), and only after passing does Phase 3 actually run the criterion;
# # hybrid = both must pass: the risk criterion and
# # grade==CONSISTENT must hold at once, and the per-marker verdict is written into the evaluation notes
# consistency_stringency: 1 # consistency strength tier 1..5, thresholds step down tier by tier; default 1 (provisional, not yet calibrated)
# cog_category_map: "" # optional TSV of marker_id<TAB>functional_category.
# # When the file is absent or a row is missing, the column renders NA and is noted in the report; no category is invented
# min_informative_sites: 0 # per-marker parsimony-informative-site (PIS) floor, 0 = off (provisional).
# # Markers below the floor are marked inconclusive in the decision card/report and must not be read as "clean";
# # does not change ev.level; whether to drop them is a release decision

# Output numeric-assertion layer
# strict_assertions: true # exit with code 4 when a severity=fail assertion fires
# allow_assertion_failure: false # explicitly bypasses the item above; the bypass is written into the report
# Taxonomy must-pass gate: off by default. Once enabled, any violated "must hold"
# taxonomic relationship aborts the run with exit code 4 (it is not a risk-score deduction).
# The bare switch uses the in-repo baseline YAML; you may also give a path explicitly.
# The artifact is Phase5_reports/{prefix}.mustpass.tsv.
# Note: the baseline's markers.ids is still an unfilled skeleton (the 62 ribosomal marker ids
# must be completed for your study group). In that state the gate tests EVERY marker gene tree;
# if ids are filled but do not intersect this dataset, the gate aborts outright rather than
# reporting a "pass".
# taxonomy_mustpass: "tests/benchmark/expected/taxonomy_mustpass.yaml"

# The compositional / GC-bias diagnostic is off by default and is only ever a parallel evidence
# column, never folded into overall_risk / overall_score (locked by tests).
# How to enable it: write hgt_steps as "phylogenetic,composition"
# (equivalent CLI: --hgt-steps phylogenetic,composition). The artifact is
# Phase5_reports/{prefix}.composition.tsv (rcv/gc_bias/n_sequences/outlier_flag;
# outliers are sorted to the top, and gc_bias is always NA=NOT_APPLICABLE for protein input).
# Note: HeterogeneityConfig.enable_composition_screen is equivalent to the above (either being
# true enables it), but it can still only be set in code - neither the config file nor the CLI
# has a key for it; the switch in this file is hgt_steps.
# composition_warn_threshold in that same object now really takes effect (it reaches the outlier
# verdict through PipelineConfig.heterogeneity_config); setting composition_outlier_metric to
# anything other than rcv logs a WARN saying only rcv is implemented.

# Marker Discovery
# marker_mode: "gtdb_tk" uses the ar53/bac120 per-marker FASTA extracted by GTDB-Tk (requires --gtdb-markers-dir)
# "hmm" uses the TIGRFAM/Pfam HMM directory scanned by HMMER in the input genomes (--marker-hmm-dir),
# with no GTDB-Tk pre-run needed.
marker_mode: "gtdb_tk"
# How to locate the marker HMMs when marker_hmm_dir is not given explicitly (hmm mode only):
# auto = discover automatically under db/gtdb_markers/{ar53,bac120} by the detected domain;
# gtdb = only db/gtdb_markers; cog = only db/cog_hmm; none = no automatic discovery
marker_db_source: "auto"

# [required in gtdb_tk mode] directory of the per-marker FASTA extracted by GTDB-Tk
# gtdb_markers_dir: "gtdbtk_out/align/marker_genes"

# [hmm mode] TIGRFAM/Pfam HMM directory (auto-discovered per marker_db_source when omitted)
# marker_hmm_dir: "GTDB-Tk-214-Markers/pfam/individual_hmms"

# Phylogenetic Inference
ufboot: 1000 # UFBOOT replicates
# Gene-tree builder for coalescent inference. Options: "fasttree" (FastTree2 with WAG, fast)
# or "iqtree" (IQ-TREE3, thorough). Default: fasttree. This explicitly selects the per-marker gene-tree
# method in coalescent mode. The legacy "fast_tree: true" is still accepted as an
# alias for "gene_tree_builder: fasttree".
gene_tree_builder: fasttree
coalescent_mode: post-filter # Options: off, post-filter, always

# Legacy alias (kept for backward compatibility):
# fast_tree: false # Use FastTree2 instead of IQ-TREE3

# MAG Optimization (CheckM)
checkm_results: "" # Pre-computed CheckM results file (TSV with 'Bin Id', 'Completeness', 'Contamination')
skip_checkm: false # Force skip CheckM and use default quality estimates
# Minimum occupancy floor for marker selection (0-1): when given explicitly it overrides the
# Phase 0 adaptive threshold. The deprecated alias min_marker_coverage is still accepted and does
# the same thing.
# min_occupancy: 0.75

# Report
report_format: html # Options: html

# Taxonomy
# taxonomy_table: "" # External taxonomy table file
# taxonomy_format: table # Format: table (Format B) or embedded (Format A)
# taxonomy_source_priority: table # Options: embedded, table
# taxonomy_delimiter_mode: reverse # Options: reverse, greedy, segment
# table_sep: "" # Force table separator (auto-detect if empty)

# Tree Validation
# multi_tree_mode: ask # Options: ask, first, last, random (split not supported for reference trees)
# strip_annotations: false # Remove NHX/bootstrap annotations
# mol_type: "" # Force molecule type: DNA, RNA, protein (auto-detect if empty)
# skip_length_check: false # Skip sequence length consistency check
# no_cross_check: false # Skip tree-sequence cross-validation

# Reproducing a previous run: pass the Phase5_metadata/run_config.json of that run as the config
# file; the nested parameters snapshot inside it is expanded and applied automatically.
# For example: markerfinder --config output/Phase5_metadata/run_config.json -i genomes/ -o output/

# Logging
# log_file: "" # Path to log file (UTpersistent)

# Output Management
# force: false # Overwrite existing output files
# no_clobber: false # Skip output if file already exists
# save_intermediates: false # Copy useful intermediate files (marker sequences, alignments,
# # supermatrix, CheckM output) to <output>/Phase4_intermediate/
# redo: false # Stepwise mode: force re-run an already-completed step
# resume: false # Stepwise mode: auto-run missing prerequisite steps and continue

# Advanced
# tmp_dir: use a path separate from output, so it cannot clash with the output-directory check.
# Left empty by default, MarkerFinder creates its own markerfinder-{uuid8} subdirectory per run
# under the system temporary directory and cleans it up when the run finishes.
# tmp_dir: /tmp/markerfinder-run
db_dir: ./db

# Whether to keep the temporary directory. Default false: cleaned up when the run finishes;
# set true to keep the intermediate files for debugging.
keep_tmp: false

verbose: 0 # Verbosity level (0=WARNING, 1=INFO, 2=DEBUG)
