name: markerfinder
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  # ete3 cannot be imported on Python 3.13 and later (its webapp still does
  # `import cgi`, removed from the standard library), so the interpreter is
  # pinned to the supported range. See README「Environment and Verification」.
  - python=3.10

  # External tools the pipeline shells out to. The mapping from tool to call
  # site is data in markerfinder/utils/dependency_check.py (EXTERNAL_TOOLS /
  # TOOL_STEPS); this file must install exactly that set.
  - hmmer>=3.3.2 # hmmsearch — marker scanning (critical)
  - mafft>=7.520 # multiple sequence alignment
  - trimal>=1.4 # alignment trimming
  - iqtree>=3.0.0 # iqtree3 — ML gene trees (--gene-tree-builder iqtree)
  - astral-tree>=5.7.0 # coalescent species tree
  - fasttree>=2.1.11 # FastTree / fasttree — fast gene trees
  - checkm-genome>=1.2 # optional: MAG quality (needs its own ~1.4 GB data package)
  - ete3 # phylogenetic tree operations (Python 3.10-3.12)

  # Only for rebuilding validation/data. The committed fixtures are enough to
  # run ``pytest tests``; the 12 NCBI RefSeq proteomes the validation suite runs
  # on are fetched on demand by validation/scripts/01_fetch_genomes.py, which
  # reads the authoritative organism lineage from this CLI.
  - ncbi-datasets-cli

  - pip
  - pip:
      # Runtime dependencies, exactly as declared in pyproject.toml.
      # pandas / numpy / scipy / rich are deliberately absent: nothing in the
      # package imports them.
      - biopython>=1.81
      - pyyaml>=6.0
      - ete3>=3.1
      - tomli>=2.0;python_version<'3.11'
